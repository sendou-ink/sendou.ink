[[lint.overrides]]
files = [
	"app/features/*/routes/**",
	"app/modules/*/routes/**",
	"app/features/*/loaders/**",
	"app/features/*/actions/**",
]
rules = { "unicorn/filename-case" = "off" }

[[lint.overrides]]
files = ["**/*.ts"]
rules = { "react/function-component-definition" = "off" }

[[lint.overrides]]
files = [
	"app/features/*/routes/**",
	"app/modules/*/routes/**",
	"app/root.tsx",
	"app/routes.ts",
	"app/entry.server.tsx",
	"*.config.ts",
	"docs/site/astro.config.ts",
	"knip.ts",
	"e2e/global-setup.ts",
	"e2e/global-teardown.ts",
	"scripts/**",
]
rules = { "import/no-default-export" = "off" }

[[lint.overrides]]
files = ["**/*.test.ts", "**/*.test.tsx"]
rules = { "bun:test/consistent-test-it" = ["error", { fn = "test", withinDescribe = "test" }], "bun:test/prefer-hooks-on-top" = "error", "bun:test/prefer-hooks-in-order" = "error", "sendou/no-raw-db-writes-in-tests" = "error", "typescript/await-thenable" = "off" }

[[lint.overrides]]
files = ["e2e/**"]
rules = { "playwright/no-page-pause" = "error", "playwright/no-wait-for-timeout" = "error", "playwright/missing-playwright-await" = "error", "playwright/no-useless-await" = "error", "playwright/no-wait-for-navigation" = "error", "playwright/no-element-handle" = "error", "playwright/no-eval" = "error", "playwright/no-networkidle" = "error", "playwright/no-wait-for-selector" = "error", "playwright/valid-describe-callback" = "error" }

[fmt]
ignorePatterns = [
	"scripts/dicts/**",
	"scripts/output/**",
	"docs/site/dist/**",
	"docs/site/.astro/**",
	"docs/site/visits.json",
	"app/db/seed/data/placements.json",
	"build/**",
	"app/features/scanner/tests/fixtures/**",
	"test-results/**",
	"playwright-report/**",
	".react-router/**",
	"content/**",
]

[fmt.sortImports]
groups = [
	"builtin",
	"external",
	"internal",
	["parent", "sibling", "index", "style"],
	"unknown",
]
internalPattern = ["~/"]
newlinesBetween = false

[[lint.overrides]]
files = ["app/utils/kysely.server.ts"]
rules = { "sendou/no-kysely-sqlite-helpers" = "off" }

[[lint.overrides]]
files = ["app/**"]
rules = { "sendou/no-and-conditional-rendering" = "error" }

[[lint.overrides]]
files = ["app/**"]
excludeFiles = ["app/modules/search-params/**"]
rules = { "sendou/no-raw-search-params" = "error" }

[[lint.overrides]]
files = ["app/**"]
excludeFiles = ["app/hooks/useActionSubmit.ts"]
rules = { "sendou/no-raw-action-forms" = "error" }

[[lint.overrides]]
files = ["app/**"]
excludeFiles = ["app/form/parse.server.ts", "app/form/define-action.server.ts"]
rules = { "sendou/no-raw-actions" = "error" }

[[lint.overrides]]
files = ["app/**"]
excludeFiles = ["app/features/components-showcase/**"]
rules = { "sendou/no-relative-links" = "error" }

[[lint.overrides]]
files = ["app/**"]
excludeFiles = [
	"app/modules/persisted-state/**",
	"**/*.test.ts",
	"**/*.test.tsx",
]
rules = { "sendou/no-raw-web-storage" = "error" }

[[lint.overrides]]
files = ["app/db/seed/dev/**", "app/db/seed/index.ts"]
rules = { "sendou/no-raw-db-writes-in-dev-seed" = "error" }
