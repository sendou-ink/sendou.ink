[test]
preload = [
	"./app/test-console.ts",
	"./scripts/preload.ts",
	"./app/test-setup.ts",
]
# DOM tests need happy-dom (`bun run test:dom`), the scanner golden-file suite runs via `bun run test:scanner`
pathIgnorePatterns = [
	"e2e/**",
	"**/*.dom.test.{ts,tsx}",
	"app/features/scanner/tests/*.test.{ts,tsx}",
]

[lint]
maxWarnings = 0
typeAware = true
plugins = ["playwright", "./lint-plugins/index.ts"]
ignorePatterns = [
	"scripts/dicts/**",
	"scripts/output/**",
	"docs/site/dist/**",
	"docs/site/.astro/**",
	"docs/site/visits.json",
	"build/**",
	"app/features/scanner/tests/fixtures/**",
	"test-results/**",
	"playwright-report/**",
	".react-router/**",
]

