name: Tests and checks on push

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  run-checks-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Formatter/Linter
        run: bun run biome:check
      - name: Typecheck
        run: bun run typecheck
      - name: Typecheck scripts
        run: bun run typecheck:scripts
      - name: Typecheck docs site
        run: bun run typecheck:docs
      - name: Unit tests
        run: bun run test:unit:dom
      - name: Knip unused check
        run: bun run knip
      - name: Check translations jsons
        run: bun run check-translation-jsons:no-write
      - name: Check plural key collapse
        run: bun run check-plural-collapse
      - name: Check articles
        run: bun run check-articles
      - name: Build docs site
        run: bun run docs:build
